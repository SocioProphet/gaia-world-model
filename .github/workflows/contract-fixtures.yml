name: Contract Fixtures

on:
  push:
    paths:
      - 'schemas/**'
      - 'fixtures/**'
      - 'scripts/validate_contract_fixtures.py'
      - 'scripts/validate_multidomain_fixtures.py'
      - 'scripts/validate_bounded_osm_source_adapter.py'
      - 'scripts/validate_chronos_carrier_fixtures.py'
      - 'scripts/ofif_to_gaia_bridge.py'
      - 'scripts/check_ofif_bridge_invariants.py'
      - 'scripts/soil_intelligence_fusion.py'
      - 'control_tower/anomaly_score.py'
      - 'geospatial/osm_ingest.py'
      - 'geospatial/osm_tile_export.py'
      - 'geospatial/osm_route_graph.py'
      - 'geospatial/world_claim_ingest.py'
      - 'navigation/lidar_feature_extract.py'
      - 'navigation/lidar_rollback_receipt.py'
      - '.github/workflows/contract-fixtures.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'fixtures/**'
      - 'scripts/validate_contract_fixtures.py'
      - 'scripts/validate_multidomain_fixtures.py'
      - 'scripts/validate_bounded_osm_source_adapter.py'
      - 'scripts/validate_chronos_carrier_fixtures.py'
      - 'scripts/ofif_to_gaia_bridge.py'
      - 'scripts/check_ofif_bridge_invariants.py'
      - 'scripts/soil_intelligence_fusion.py'
      - 'control_tower/anomaly_score.py'
      - 'geospatial/osm_ingest.py'
      - 'geospatial/osm_tile_export.py'
      - 'geospatial/osm_route_graph.py'
      - 'geospatial/world_claim_ingest.py'
      - 'navigation/lidar_feature_extract.py'
      - 'navigation/lidar_rollback_receipt.py'
      - '.github/workflows/contract-fixtures.yml'

jobs:
  validate-contract-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate contract fixture pairs
        run: python3 scripts/validate_contract_fixtures.py

      - name: Validate multi-domain geospatial fixtures
        run: python3 scripts/validate_multidomain_fixtures.py

      - name: Validate bounded OSM source adapter fixtures
        run: python3 scripts/validate_bounded_osm_source_adapter.py

      - name: Ingest OpenStreetMap fixture into a governed WorldClaim bundle
        run: |
          python3 geospatial/world_claim_ingest.py \
            fixtures/geospatial/osm-feature-world-claim-input.sample.v1.json \
            /tmp/gaia-world-claim-ingest-output.json

      - name: Check governed WorldClaim ingest output (incl. CHRONOS carrier fields)
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/gaia-world-claim-ingest-output.json', 'r', encoding='utf-8') as handle:
              doc = json.load(handle)
          claim = doc['claims'][0]
          trace = doc['explanation_traces'][0]
          assert claim['policy_status']['status'] == 'proposed'
          assert claim['uncertainty']['confidence_score'] == 0.85
          assert claim['map_display']['display_layer'] == 'proposed_candidate'
          assert doc['evidence_records'][0]['source_type'] == 'osm'
          assert trace['fusion_rule']['rule_class'] == 'single_source_passthrough'
          # CHRONOS carrier fields (SocioProphet/gaia-world-model#38): additive,
          # non-breaking extension for WorldClaim/FusionExplanation.
          assert claim['chronos_grounding_status'] == 'grounded'
          assert claim['chronos_owning_authority_plane'] == 'SocioProphet/holmes'
          assert trace['fusion_rule']['chronos_method_family'] == 'not_applicable'
          assert trace['fusion_rule']['chronos_method_output_type'] == 'hard_value'
          print('governed WorldClaim ingest output (incl. CHRONOS carrier fields) passed')
          PY

      - name: Validate CHRONOS carrier extension fixtures (WorldClaim/FusionExplanation)
        run: python3 scripts/validate_chronos_carrier_fixtures.py

      - name: Convert OFIF observation into GAIA artifact
        run: |
          python3 scripts/ofif_to_gaia_bridge.py \
            fixtures/ofif/observation-event.sample.v1.json \
            /tmp/gaia-ofif-output.json

      - name: Check OFIF bridge invariants
        run: |
          python3 scripts/check_ofif_bridge_invariants.py \
            fixtures/ofif/observation-event.sample.v1.json \
            /tmp/gaia-ofif-output.json

      - name: Build soil intelligence fusion artifact
        run: |
          python3 scripts/soil_intelligence_fusion.py \
            /tmp/gaia-ofif-output.json \
            fixtures/gaia/context/soil-eo-context.sample.v1.json \
            /tmp/gaia-soil-fusion-output.json

      - name: Score control tower anomaly fixture
        run: |
          python3 control_tower/anomaly_score.py \
            fixtures/control-tower/navigation-asset-health-card.sample.v1.json \
            /tmp/control-tower-anomaly-output.json

      - name: Check control tower anomaly output
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/control-tower-anomaly-output.json', 'r', encoding='utf-8') as handle:
              doc = json.load(handle)
          assert doc['artifact_type'] == 'gaia.control_tower.anomaly_score.output'
          assert 'risk_exposure' in doc
          assert 'work_order_candidate' in doc
          assert doc['policy']['action_status'] == 'approval_required'
          print('control tower anomaly output passed')
          PY

      - name: Ingest OpenStreetMap fixture
        run: |
          python3 geospatial/osm_ingest.py \
            fixtures/geospatial/osm-way-input.sample.v1.json \
            /tmp/osm-feature-bindings.json

      - name: Check OpenStreetMap ingestion output
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/osm-feature-bindings.json', 'r', encoding='utf-8') as handle:
              doc = json.load(handle)
          assert doc['artifact_type'] == 'gaia.osm_ingestion.output'
          assert doc['source'] == 'OpenStreetMap'
          assert doc['policy']['attribution_required'] is True
          assert doc['bindings'][0]['osm_ref']['osm_type'] == 'way'
          assert doc['bindings'][0]['attribution']['attribution_text']
          print('OpenStreetMap ingestion output passed')
          PY

      - name: Export OpenStreetMap tile layer fixture
        run: |
          python3 geospatial/osm_tile_export.py \
            fixtures/geospatial/osm-road-feature-binding.sample.v1.json \
            /tmp/osm-derived-map-tile-layer.json

      - name: Check OpenStreetMap tile layer output
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/osm-derived-map-tile-layer.json', 'r', encoding='utf-8') as handle:
              doc = json.load(handle)
          assert doc['manifest_version'] == 'v1'
          assert doc['layer_type'] == 'vector'
          assert doc['tiles']['format'] == 'mvt'
          assert doc['attribution']['attribution_text']
          assert doc['provenance']['source_refs']
          print('OpenStreetMap tile layer output passed')
          PY

      - name: Build OpenStreetMap route graph fixture
        run: |
          python3 geospatial/osm_route_graph.py \
            fixtures/geospatial/osm-road-feature-binding.sample.v1.json \
            /tmp/osm-route-graph.json

      - name: Check OpenStreetMap route graph output
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/osm-route-graph.json', 'r', encoding='utf-8') as handle:
              doc = json.load(handle)
          assert doc['manifest_version'] == 'v1'
          assert doc['source'] == 'OpenStreetMap'
          assert doc['safety_status'] == 'advisory'
          assert doc['nodes']
          assert doc['edges']
          assert doc['attribution']['attribution_text']
          print('OpenStreetMap route graph output passed')
          PY

      - name: Extract LiDAR-derived infrastructure assets
        run: |
          python3 navigation/lidar_feature_extract.py \
            fixtures/navigation/rail-corridor-lidar-observation.sample.v1.json \
            /tmp/lidar-derived-infrastructure-assets.json

      - name: Check LiDAR feature extraction output
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/lidar-derived-infrastructure-assets.json', 'r', encoding='utf-8') as handle:
              doc = json.load(handle)
          assert doc['artifact_type'] == 'gaia.navigation.lidar_feature_extract.output'
          assert doc['safety_status'] == 'advisory'
          assert len(doc['assets']) >= 3
          assert any(asset['asset_type'] == 'CorridorVegetationFeature' for asset in doc['assets'])
          assert all(asset['provenance']['source_refs'] for asset in doc['assets'])
          print('LiDAR feature extraction output passed')
          PY

      - name: Check LiDAR malformed input fails closed
        run: |
          set +e
          python3 navigation/lidar_feature_extract.py \
            fixtures/navigation/rail-corridor-lidar-observation.malformed-missing-point-cloud.sample.v1.json \
            /tmp/lidar-malformed-output.json
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected malformed LiDAR input to fail"
            exit 1
          fi
          echo "malformed LiDAR input failed closed as expected"

      - name: Build LiDAR rollback receipt
        run: |
          python3 navigation/lidar_rollback_receipt.py \
            fixtures/navigation/lidar-runtime-rollback-plan.sample.v1.json \
            /tmp/lidar-rollback-receipt.json

      - name: Check LiDAR rollback receipt
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/lidar-rollback-receipt.json', 'r', encoding='utf-8') as handle:
              doc = json.load(handle)
          assert doc['receipt_type'] == 'gaia.navigation.lidar_rollback_receipt'
          assert doc['mutation_policy']['source_observations_mutated'] is False
          assert doc['mutation_policy']['point_cloud_artifacts_mutated'] is False
          assert doc['mutation_policy']['derived_outputs_mutated'] is False
          assert doc['preserve_refs']
          assert doc['demote_refs']
          assert doc['approval']['approval_required'] is True
          print('LiDAR rollback receipt passed')
          PY
