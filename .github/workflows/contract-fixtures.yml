name: Contract Fixtures

on:
  push:
    paths:
      - 'schemas/**'
      - 'fixtures/**'
      - 'scripts/validate_contract_fixtures.py'
      - 'scripts/ofif_to_gaia_bridge.py'
      - 'scripts/check_ofif_bridge_invariants.py'
      - 'scripts/soil_intelligence_fusion.py'
      - '.github/workflows/contract-fixtures.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'fixtures/**'
      - 'scripts/validate_contract_fixtures.py'
      - 'scripts/ofif_to_gaia_bridge.py'
      - 'scripts/check_ofif_bridge_invariants.py'
      - 'scripts/soil_intelligence_fusion.py'
      - '.github/workflows/contract-fixtures.yml'

jobs:
  validate-contract-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate contract fixture pairs
        run: python3 scripts/validate_contract_fixtures.py

      - name: Convert OFIF observation into GAIA artifact
        run: |
          python3 scripts/ofif_to_gaia_bridge.py \
            fixtures/ofif/observation-event.sample.v1.json \
            /tmp/gaia-ofif-output.json

      - name: Check OFIF bridge invariants
        run: |
          python3 scripts/check_ofif_bridge_invariants.py \
            fixtures/ofif/observation-event.sample.v1.json \
            /tmp/gaia-ofif-output.json

      - name: Build soil intelligence fusion artifact
        run: |
          python3 scripts/soil_intelligence_fusion.py \
            /tmp/gaia-ofif-output.json \
            fixtures/gaia/context/soil-eo-context.sample.v1.json \
            /tmp/gaia-soil-fusion-output.json
