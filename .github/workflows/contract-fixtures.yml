name: Contract Fixtures

on:
  push:
    paths:
      - 'schemas/**'
      - 'fixtures/**'
      - 'scripts/validate_contract_fixtures.py'
      - 'scripts/ofif_to_gaia_bridge.py'
      - 'scripts/check_ofif_bridge_invariants.py'
      - 'scripts/soil_intelligence_fusion.py'
      - 'control_tower/anomaly_score.py'
      - '.github/workflows/contract-fixtures.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'fixtures/**'
      - 'scripts/validate_contract_fixtures.py'
      - 'scripts/ofif_to_gaia_bridge.py'
      - 'scripts/check_ofif_bridge_invariants.py'
      - 'scripts/soil_intelligence_fusion.py'
      - 'control_tower/anomaly_score.py'
      - '.github/workflows/contract-fixtures.yml'

jobs:
  validate-contract-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate contract fixture pairs
        run: python3 scripts/validate_contract_fixtures.py

      - name: Convert OFIF observation into GAIA artifact
        run: |
          python3 scripts/ofif_to_gaia_bridge.py \
            fixtures/ofif/observation-event.sample.v1.json \
            /tmp/gaia-ofif-output.json

      - name: Check OFIF bridge invariants
        run: |
          python3 scripts/check_ofif_bridge_invariants.py \
            fixtures/ofif/observation-event.sample.v1.json \
            /tmp/gaia-ofif-output.json

      - name: Build soil intelligence fusion artifact
        run: |
          python3 scripts/soil_intelligence_fusion.py \
            /tmp/gaia-ofif-output.json \
            fixtures/gaia/context/soil-eo-context.sample.v1.json \
            /tmp/gaia-soil-fusion-output.json

      - name: Score control tower anomaly fixture
        run: |
          python3 control_tower/anomaly_score.py \
            fixtures/control-tower/navigation-asset-health-card.sample.v1.json \
            /tmp/control-tower-anomaly-output.json

      - name: Check control tower anomaly output
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/control-tower-anomaly-output.json', 'r', encoding='utf-8') as handle:
              doc = json.load(handle)
          assert doc['artifact_type'] == 'gaia.control_tower.anomaly_score.output'
          assert 'risk_exposure' in doc
          assert 'work_order_candidate' in doc
          assert doc['policy']['action_status'] == 'approval_required'
          print('control tower anomaly output passed')
          PY
