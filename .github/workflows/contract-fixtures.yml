name: Contract Fixtures

on:
  push:
    paths:
      - 'schemas/**'
      - 'fixtures/**'
      - 'scripts/validate_contract_fixtures.py'
      - 'scripts/ofif_to_gaia_bridge.py'
      - 'scripts/check_ofif_bridge_invariants.py'
      - 'scripts/soil_intelligence_fusion.py'
      - 'control_tower/anomaly_score.py'
      - 'geospatial/osm_ingest.py'
      - 'geospatial/osm_tile_export.py'
      - 'geospatial/osm_route_graph.py'
      - '.github/workflows/contract-fixtures.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'fixtures/**'
      - 'scripts/validate_contract_fixtures.py'
      - 'scripts/ofif_to_gaia_bridge.py'
      - 'scripts/check_ofif_bridge_invariants.py'
      - 'scripts/soil_intelligence_fusion.py'
      - 'control_tower/anomaly_score.py'
      - 'geospatial/osm_ingest.py'
      - 'geospatial/osm_tile_export.py'
      - 'geospatial/osm_route_graph.py'
      - '.github/workflows/contract-fixtures.yml'

jobs:
  validate-contract-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate contract fixture pairs
        run: python3 scripts/validate_contract_fixtures.py

      - name: Convert OFIF observation into GAIA artifact
        run: |
          python3 scripts/ofif_to_gaia_bridge.py \
            fixtures/ofif/observation-event.sample.v1.json \
            /tmp/gaia-ofif-output.json

      - name: Check OFIF bridge invariants
        run: |
          python3 scripts/check_ofif_bridge_invariants.py \
            fixtures/ofif/observation-event.sample.v1.json \
            /tmp/gaia-ofif-output.json

      - name: Build soil intelligence fusion artifact
        run: |
          python3 scripts/soil_intelligence_fusion.py \
            /tmp/gaia-ofif-output.json \
            fixtures/gaia/context/soil-eo-context.sample.v1.json \
            /tmp/gaia-soil-fusion-output.json

      - name: Score control tower anomaly fixture
        run: |
          python3 control_tower/anomaly_score.py \
            fixtures/control-tower/navigation-asset-health-card.sample.v1.json \
            /tmp/control-tower-anomaly-output.json

      - name: Check control tower anomaly output
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/control-tower-anomaly-output.json', 'r', encoding='utf-8') as handle:
              doc = json.load(handle)
          assert doc['artifact_type'] == 'gaia.control_tower.anomaly_score.output'
          assert 'risk_exposure' in doc
          assert 'work_order_candidate' in doc
          assert doc['policy']['action_status'] == 'approval_required'
          print('control tower anomaly output passed')
          PY

      - name: Ingest OpenStreetMap fixture
        run: |
          python3 geospatial/osm_ingest.py \
            fixtures/geospatial/osm-way-input.sample.v1.json \
            /tmp/osm-feature-bindings.json

      - name: Check OpenStreetMap ingestion output
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/osm-feature-bindings.json', 'r', encoding='utf-8') as handle:
              doc = json.load(handle)
          assert doc['artifact_type'] == 'gaia.osm_ingestion.output'
          assert doc['source'] == 'OpenStreetMap'
          assert doc['policy']['attribution_required'] is True
          assert doc['bindings'][0]['osm_ref']['osm_type'] == 'way'
          assert doc['bindings'][0]['attribution']['attribution_text']
          print('OpenStreetMap ingestion output passed')
          PY

      - name: Export OpenStreetMap tile layer fixture
        run: |
          python3 geospatial/osm_tile_export.py \
            fixtures/geospatial/osm-road-feature-binding.sample.v1.json \
            /tmp/osm-derived-map-tile-layer.json

      - name: Check OpenStreetMap tile layer output
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/osm-derived-map-tile-layer.json', 'r', encoding='utf-8') as handle:
              doc = json.load(handle)
          assert doc['manifest_version'] == 'v1'
          assert doc['layer_type'] == 'vector'
          assert doc['tiles']['format'] == 'mvt'
          assert doc['attribution']['attribution_text']
          assert doc['provenance']['source_refs']
          print('OpenStreetMap tile layer output passed')
          PY

      - name: Build OpenStreetMap route graph fixture
        run: |
          python3 geospatial/osm_route_graph.py \
            fixtures/geospatial/osm-road-feature-binding.sample.v1.json \
            /tmp/osm-route-graph.json

      - name: Check OpenStreetMap route graph output
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/osm-route-graph.json', 'r', encoding='utf-8') as handle:
              doc = json.load(handle)
          assert doc['manifest_version'] == 'v1'
          assert doc['source'] == 'OpenStreetMap'
          assert doc['safety_status'] == 'advisory'
          assert doc['nodes']
          assert doc['edges']
          assert doc['attribution']['attribution_text']
          print('OpenStreetMap route graph output passed')
          PY
