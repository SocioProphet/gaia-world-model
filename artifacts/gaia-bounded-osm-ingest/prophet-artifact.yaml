apiVersion: socioprophet.org/v1alpha1
kind: ProphetArtifact
metadata:
  name: gaia.bounded-osm-ingest
  version: 0.1.0
  ownerRepo: SocioProphet/gaia-world-model
  maintainers:
    - SocioProphet/gaia-world-model
  slashTopics:
    - /gaia/osm
    - /gaia/ingest
    - /world-model/provenance
spec:
  artifactKind: workflow
  summary: >-
    Fixture-first bounded OpenStreetMap ingest workflow for turning an explicit
    region source into validated GAIA features, provenance receipts, registry
    payloads, search payloads, metrics, and optional tile/API outputs.
  actions:
    - name: detect-host-and-runtime
      verb: detect
      adapter: sourceos.host-detect.v1
      script: artifacts/gaia-bounded-osm-ingest/adapters/detect.py
      outputs:
        - host-facts
      requiresNetwork: false
      privileged: false
    - name: fetch-bounded-region-source
      verb: fetch
      adapter: gaia.osm.fetch-bounded-region.v1
      script: artifacts/gaia-bounded-osm-ingest/adapters/fetch.py
      inputs:
        - region-bbox
      outputs:
        - source-receipts
      requiresNetwork: false
      privileged: false
    - name: prepare-normalized-osm-features
      verb: prepare
      adapter: gaia.osm.normalize.v1
      script: artifacts/gaia-bounded-osm-ingest/adapters/prepare.py
      inputs:
        - osm-source
      outputs:
        - normalized-features
      requiresNetwork: false
      privileged: false
    - name: validate-gaia-feature-contract
      verb: validate
      adapter: gaia.features.validate.v1
      script: artifacts/gaia-bounded-osm-ingest/adapters/validate.py
      inputs:
        - normalized-features
      outputs:
        - validation-report
      requiresNetwork: false
      privileged: false
    - name: run-bounded-ingest
      verb: run
      adapter: gaia.ingest.bounded.v1
      script: artifacts/gaia-bounded-osm-ingest/adapters/run.py
      inputs:
        - normalized-features
      outputs:
        - gaia-feature-store
        - gaia-tile-manifest
      requiresNetwork: false
      privileged: false
    - name: benchmark-ingest
      verb: benchmark
      adapter: delivery-excellence.metrics.collect.v1
      script: artifacts/gaia-bounded-osm-ingest/adapters/benchmark.py
      inputs:
        - gaia-feature-store
      outputs:
        - benchmark-report
      requiresNetwork: false
      privileged: false
    - name: publish-registry-and-search-payloads
      verb: publish
      adapter: prophet-platform.registry-export.v1
      script: artifacts/gaia-bounded-osm-ingest/adapters/publish.py
      inputs:
        - gaia-feature-store
        - validation-report
        - benchmark-report
      outputs:
        - sociosphere-registration
        - sherlock-index-payload
        - delivery-excellence-scoreboard-payload
      requiresNetwork: false
      privileged: false
    - name: attest-run
      verb: attest
      adapter: prophet-platform.attest-run.v1
      script: artifacts/gaia-bounded-osm-ingest/adapters/attest.py
      inputs:
        - source-receipts
        - validation-report
        - benchmark-report
      outputs:
        - run-record
        - checksums
        - lineage
      requiresNetwork: false
      privileged: false
  inputs:
    - name: region-bbox
      kind: uri
      uri: fixture://gaia/osm/regions/demo-bbox.json
      path: fixtures/gaia/osm/regions/demo-bbox.json
      schema: artifacts/gaia-bounded-osm-ingest/schemas/gaia.region-bbox.schema.json
      contentType: application/json
    - name: osm-source
      kind: file
      path: fixtures/osm/demo-region.osm.json
      contentType: application/json
  outputs:
    - name: normalized-features
      kind: file
      path: build/gaia/osm/normalized-features.ndjson
      schema: artifacts/gaia-bounded-osm-ingest/schemas/gaia.osm-feature.schema.json
      contentType: application/x-ndjson
    - name: gaia-feature-store
      kind: directory
      path: build/gaia/features/
    - name: gaia-tile-manifest
      kind: file
      path: build/gaia/tiles/tile-manifest.json
      schema: artifacts/gaia-bounded-osm-ingest/schemas/gaia.tile-manifest.schema.json
      contentType: application/json
    - name: source-receipts
      kind: receipt
      path: build/evidence/source-receipts.json
      schema: artifacts/gaia-bounded-osm-ingest/schemas/gaia.source-receipt.schema.json
      contentType: application/json
    - name: validation-report
      kind: receipt
      path: build/evidence/validation-report.json
      schema: artifacts/gaia-bounded-osm-ingest/schemas/gaia.validation-report.schema.json
      contentType: application/json
    - name: benchmark-report
      kind: metric
      path: build/evidence/benchmark-report.json
      schema: artifacts/gaia-bounded-osm-ingest/schemas/gaia.benchmark-report.schema.json
      contentType: application/json
    - name: run-record
      kind: receipt
      path: build/evidence/run-record.json
      contentType: application/json
    - name: sociosphere-registration
      kind: receipt
      path: build/evidence/sociosphere-registration.json
      contentType: application/json
    - name: sherlock-index-payload
      kind: receipt
      path: build/evidence/sherlock-index-payload.json
      contentType: application/json
    - name: delivery-excellence-scoreboard-payload
      kind: receipt
      path: build/evidence/delivery-excellence-scoreboard.json
      contentType: application/json
    - name: checksums
      kind: receipt
      path: build/evidence/checksums.json
      contentType: application/json
    - name: lineage
      kind: receipt
      path: build/evidence/lineage.json
      contentType: application/json
  fixtureRunner: artifacts/gaia-bounded-osm-ingest/run_fixture.py
  runtime:
    substrate: container
    profile: lattice-forge/gaia-osm-ingest:0.1.0
    dependencies:
      - python>=3.11
    hardware:
      - cpu
    environment:
      GAIA_ARTIFACT_MODE: fixture
      GAIA_NETWORK_POSTURE: allowlisted
  provenance:
    sourceUri: https://www.openstreetmap.org/
    license: ODbL-1.0
    attribution: OpenStreetMap contributors; GAIA wrapper artifacts are governed by repository license and attribution policy.
    receipts:
      - build/evidence/source-receipts.json
    freshness: bounded fixture first; live-region mode requires explicit source timestamp and attribution receipt.
    lineage:
      - build/evidence/lineage.json
  policy:
    safetyClass: bounded
    promotionGate: gaia-bounded-osm-fixture-validation
    networkPosture: allowlisted
    requiresHumanReview: false
  evidence:
    logs:
      - build/logs/gaia-bounded-osm-ingest.log
    checksums:
      - build/evidence/checksums.json
    sboms:
      - build/evidence/sbom.spdx.json
    signatures:
      - build/evidence/signatures.json
    lineage:
      - build/evidence/lineage.json
  metrics:
    - name: feature_count
      unit: count
      direction: informational
      publishToScoreboard: true
    - name: invalid_feature_count
      unit: count
      threshold: 0
      direction: minimize
      publishToScoreboard: true
    - name: ingest_latency_ms
      unit: milliseconds
      direction: minimize
      publishToScoreboard: true
    - name: reproducibility_score
      unit: ratio
      threshold: 1.0
      direction: maximize
      publishToScoreboard: true
  registrations:
    sociosphere: true
    sherlock: true
    holmes: true
    deliveryExcellence: true
